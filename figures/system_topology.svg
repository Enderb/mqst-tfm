<svg width="100%" viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ZCU216 QICK system topology</title>
<desc>Signal flow from the tProcessor inside the ZCU216 RFSoC through the XM655 analogue front-end to the qubit chip, showing the readout drive path, qubit drive path, and readout return path.</desc>
<defs>
  <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: sans-serif; }
    .tc  { font-size: 17px; font-weight: 600; fill: #2C2C2A; }
    .th  { font-size: 16px; font-weight: 500; fill: #2C2C2A; }
    .ts  { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th  { fill: #3C3489; }
    .c-purple .ts  { fill: #534AB7; }
    .c-teal rect   { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th    { fill: #085041; }
    .c-teal .ts    { fill: #0F6E56; }
    .c-amber rect  { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .th   { fill: #633806; }
    .c-amber .ts   { fill: #854F0B; }
    .c-blue rect   { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue .th    { fill: #0C447C; }
    .c-blue .ts    { fill: #185FA5; }
  </style>
</defs>

<!-- ============ Containers (same height, aligned titles) ============ -->
<!-- ZCU216 container -->
<rect x="20" y="30" width="300" height="345" rx="14" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 3" opacity="0.6"/>
<text class="tc" x="170" y="53" text-anchor="middle">ZCU216 RFSoC</text>

<!-- XM655 container -->
<rect x="360" y="30" width="140" height="345" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
<text class="tc" x="430" y="53" text-anchor="middle">XM655</text>

<!-- Qubit chip container -->
<rect x="540" y="30" width="175" height="345" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4" opacity="0.4"/>
<text class="tc" x="627" y="53" text-anchor="middle">Qubit chip</text>
<text class="ts" x="627" y="70" text-anchor="middle" opacity="0.65">(future)</text>

<!-- ============ Row 1 (y = 120): readout drive ============ -->
<!-- tProcessor (left inner column) -->
<g class="c-purple">
  <rect x="38" y="95" width="118" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="97" y="114" text-anchor="middle">tProcessor V2</text>
  <text class="ts" x="97" y="132" text-anchor="middle">Pulse sequencing</text>
</g>
<!-- Signal gen 0 (right inner column) -->
<g class="c-teal">
  <rect x="190" y="95" width="118" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="249" y="114" text-anchor="middle">Signal gen 0</text>
  <text class="ts" x="249" y="132" text-anchor="middle">DAC tile 2, blk 0</text>
</g>
<!-- BALUN RO TX -->
<g class="c-amber">
  <rect x="372" y="95" width="116" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="430" y="114" text-anchor="middle">BALUN (RO TX)</text>
  <text class="ts" x="430" y="132" text-anchor="middle">diff. &#x2192; single</text>
</g>
<!-- Resonator -->
<g class="c-blue">
  <rect x="552" y="95" width="130" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="617" y="114" text-anchor="middle">Resonator</text>
  <text class="ts" x="617" y="132" text-anchor="middle">Dispersive readout</text>
</g>

<!-- ============ Row 2 (y = 215): qubit drive ============ -->
<!-- Signal gen N -->
<g class="c-teal">
  <rect x="190" y="190" width="118" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="249" y="209" text-anchor="middle">Signal gen N</text>
  <text class="ts" x="249" y="227" text-anchor="middle">Qubit drive, &#x3C0; pulse</text>
</g>
<!-- BALUN DR TX -->
<g class="c-amber">
  <rect x="372" y="190" width="116" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="430" y="209" text-anchor="middle">BALUN (DR TX)</text>
  <text class="ts" x="430" y="227" text-anchor="middle">diff. &#x2192; single</text>
</g>
<!-- Qubit -->
<g class="c-blue">
  <rect x="552" y="190" width="130" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="617" y="209" text-anchor="middle">Qubit</text>
  <text class="ts" x="617" y="227" text-anchor="middle">Fluxonium/transmon</text>
</g>

<!-- ============ Row 3 (y = 310): readout return ============ -->
<!-- IQ output (left inner column) -->
<g class="c-purple">
  <rect x="38" y="285" width="118" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="97" y="304" text-anchor="middle">IQ output</text>
  <text class="ts" x="97" y="322" text-anchor="middle">Decimated/accum.</text>
</g>
<!-- Readout ch. 0 (right inner column) -->
<g class="c-teal">
  <rect x="190" y="285" width="118" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="249" y="304" text-anchor="middle">Readout ch. 0</text>
  <text class="ts" x="249" y="322" text-anchor="middle">ADC tile 2, blk 0</text>
</g>
<!-- BALUN RX -->
<g class="c-amber">
  <rect x="372" y="285" width="116" height="50" rx="6" stroke-width="1"/>
  <text class="th" x="430" y="304" text-anchor="middle">BALUN (RX)</text>
  <text class="ts" x="430" y="322" text-anchor="middle">single &#x2192; diff.</text>
</g>

<!-- ============ Loopback note (XM655, bottom) ============ -->
<rect x="368" y="343" width="124" height="28" rx="6" fill="none" stroke="#888780" stroke-width="0.6" stroke-dasharray="3 2" opacity="0.45"/>
<text class="ts" x="430" y="355" text-anchor="middle" opacity="0.65">Loopback (cal.):</text>
<text class="ts" x="430" y="367" text-anchor="middle" opacity="0.65">TX &#x2192; SMA &#x2192; RX</text>

<!-- ============ Arrows inside ZCU216 ============ -->
<!-- tProc -> signal gen 0 (row 1, horizontal) -->
<line x1="157" y1="120" x2="189" y2="120" stroke="#888780" stroke-width="1.5" marker-end="url(#arr-gray)"/>
<!-- tProc -> signal gen N (L-bend down to row 2) -->
<path d="M97 145 L97 215 L189 215" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arr-gray)" opacity="0.75"/>
<!-- readout ch. 0 -> IQ output (row 3, horizontal, leftward) -->
<line x1="189" y1="310" x2="157" y2="310" stroke="#378ADD" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- ============ Cross-block arrows (all horizontal) ============ -->
<!-- Row 1: signal gen 0 -> BALUN RO TX -> resonator (green) -->
<line x1="309" y1="120" x2="371" y2="120" stroke="#1D9E75" stroke-width="2" marker-end="url(#arr-green)"/>
<line x1="489" y1="120" x2="551" y2="120" stroke="#1D9E75" stroke-width="2" marker-end="url(#arr-green)"/>
<!-- Row 2: signal gen N -> BALUN DR TX -> qubit (amber) -->
<line x1="309" y1="215" x2="371" y2="215" stroke="#BA7517" stroke-width="2" marker-end="url(#arr-amber)"/>
<line x1="489" y1="215" x2="551" y2="215" stroke="#BA7517" stroke-width="2" marker-end="url(#arr-amber)"/>
<!-- Row 3: BALUN RX -> readout ch. 0 (blue, leftward) -->
<line x1="371" y1="310" x2="309" y2="310" stroke="#378ADD" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- Resonator -> qubit dispersive coupling (g) -->
<line x1="617" y1="145" x2="617" y2="189" stroke="#888780" stroke-width="1" stroke-dasharray="3 2" opacity="0.5" marker-end="url(#arr-gray)"/>
<text class="ts" x="630" y="171" opacity="0.65">g</text>

<!-- Resonator -> BALUN RX return path (blue dashed, routed around the right) -->
<path d="M682 120 L730 120 L730 310 L489 310" fill="none" stroke="#378ADD" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-blue)"/>

<!-- ============ Legend ============ -->
<line x1="38"  y1="405" x2="66"  y2="405" stroke="#1D9E75" stroke-width="2" marker-end="url(#arr-green)"/>
<text class="ts" x="72" y="409">Readout drive</text>
<line x1="210" y1="405" x2="238" y2="405" stroke="#BA7517" stroke-width="2" marker-end="url(#arr-amber)"/>
<text class="ts" x="244" y="409">Qubit drive</text>
<line x1="360" y1="405" x2="388" y2="405" stroke="#378ADD" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-blue)"/>
<text class="ts" x="394" y="409">Readout return</text>
<line x1="540" y1="405" x2="568" y2="405" stroke="#888780" stroke-width="1" stroke-dasharray="3 2" opacity="0.6" marker-end="url(#arr-gray)"/>
<text class="ts" x="574" y="409" opacity="0.7">Dispersive coupling</text>

</svg>
